<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Edit Materi - Admin Portal</title>

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- ICON -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=4">

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="../../config.js"></script>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="container navbar-content">

      <div class="logo">
        Admin RuangBelajar
      </div>

      <!-- Hamburger Button -->
      <button class="hamburger-btn" id="hamburger-btn">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="nav-menu" id="nav-menu">

        <a href="../admin-dashboard/index.html" class="nav-link">
          Dashboard
        </a>

        <a href="../manajemen-pengguna-admin/index.html" class="nav-link">
          Pengguna
        </a>

        <a href="../manajemen-kelas-admin/index.html" class="nav-link active">
          Kelas
        </a>

        <a href="../manajemen-kuis-admin/index.html" class="nav-link">
          Kuis
        </a>

        <a href="../manajemen-donasi-admin/index.html" class="nav-link">
          Donasi
        </a>

        <a href="../admin-login/index.html" class="nav-link nav-link-logout">

          <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 4px;">logout</span> Logout

        </a>

      </div>

      <div class="nav-actions">
          <a href="../admin-login/index.html" style="text-decoration:none; color:inherit;"><span class="material-symbols-outlined logout-icon-desktop" data-icon="logout">logout</span></a>
      </div>

    </div>

  </nav>

  <!-- MAIN CANVAS -->
  <main class="container">
    
    <!-- Top Header -->
    <header class="dashboard-header">
        <div class="dashboard-title">
            <button class="btn-back" id="btn-kembali">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </button>
            <h1 id="page-title">Edit Materi</h1>
            <p>Perbarui detail materi pembelajaran untuk kelas ini.</p>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="dashboard-content">
        
        <div class="form-card">
            <form id="form-edit-materi">
                
                <div class="form-group">
                    <label>Link Youtube (Video URL)</label>
                    <input type="text" id="video-input" placeholder="Contoh: https://youtube.com/watch?v=..." required />
                </div>

                <div class="form-group">
                    <label>Judul Materi</label>
                    <input type="text" id="title-input" placeholder="Contoh: Pengenalan HTML Dasar" required />
                </div>

                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <textarea id="description-input" rows="3" placeholder="Tuliskan deskripsi singkat materi ini..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Rangkuman Materi</label>
                    <textarea id="content-input" rows="10" placeholder="Tuliskan rangkuman atau poin penting dari materi ini..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-outline" id="btn-batal">Batal</button>
                    <button type="submit" class="btn-primary">Simpan Perubahan</button>
                </div>
            </form>
        </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      <div>
        <h3>RuangBelajar Admin</h3>
        <p>© 2026 RuangBelajar platform pembelajaran</p>
      </div>
      <div class="footer-links">
        <a href="https://wa.me/6289528236913" target="_blank">Kontak Kami</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="script.js?v=1"></script>

</body>

</html>
