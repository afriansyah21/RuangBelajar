<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Pertanyaan - Admin Portal</title>
  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- ICON -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- BACKGROUND -->
  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-content">
      <div class="logo">Admin RuangBelajar</div>
      <button class="hamburger-btn" id="hamburger-btn">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="nav-menu" id="nav-menu">
        <a href="../admin-dashboard/index.html" class="nav-link">Dashboard</a>
        <a href="../manajemen-pengguna-admin/index.html" class="nav-link">Pengguna</a>
        <a href="../manajemen-kelas-admin/index.html" class="nav-link">Kelas</a>
        <a href="../manajemen-kuis-admin/index.html" class="nav-link active">Kuis</a>
        <a href="../manajemen-donasi-admin/index.html" class="nav-link">Donasi</a>
        <a href="../admin-login/index.html" class="nav-link nav-link-logout">
          <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 4px;">logout</span> Logout
        </a>
      </div>
      <div class="nav-actions">
          <a href="../admin-login/index.html" style="text-decoration:none; color:inherit;"><span class="material-symbols-outlined logout-icon-desktop" data-icon="logout">logout</span></a>
      </div>
    </div>
  </nav>

  <!-- MAIN CANVAS -->
  <main class="container">
    <header class="dashboard-header">
        <div class="dashboard-title">
            <button class="btn-back" onclick="window.location.href='../detail-kuis-admin/index.html'">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </button>
            <h1>Edit Pertanyaan</h1>
            <p>Perbarui daftar soal pilihan ganda untuk kuis ini.</p>
        </div>
    </header>

    <div class="dashboard-content">
        <form id="questions-form">
            <div class="form-card" style="margin-bottom: 24px; border-left: 4px solid var(--primary-color);">
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-size: 1.1rem; color: var(--primary-color);">Nama Judul Pertanyaan (Topik)</label>
                    <input type="text" id="group-title-input" placeholder="Contoh: Konsep Dasar HTML" required />
                </div>
            </div>

            <div id="questions-container">
                <!-- Question cards will be added here by JS -->
            </div>
            
            <button type="button" class="btn-outline btn-add-question" id="btn-add-question">
                <span class="material-symbols-outlined">add</span>
                Tambah Soal
            </button>
            
            <div class="form-actions" style="margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 24px;">
                <button type="button" class="btn-outline" onclick="window.location.href='../detail-kuis-admin/index.html'">Batal</button>
                <button type="submit" class="btn-primary">Simpan Semua Perubahan</button>
            </div>
        </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div>
        <h3>RuangBelajar Admin</h3>
        <p>© 2026 RuangBelajar Educational Platform</p>
      </div>
      <div class="footer-links">
        <a href="https://wa.me/6289528236913" target="_blank">Kontak Kami</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
