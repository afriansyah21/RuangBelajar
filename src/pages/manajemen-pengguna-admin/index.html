<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Manajemen Pengguna - Admin Portal</title>
    
    <!-- Tailwind and Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Separated Assets -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body class="bg-background font-body-md text-on-surface">
    <!-- SideNavBar Shell -->
    <aside class="fixed left-0 top-0 h-full w-64 border-r border-gray-200 bg-white shadow-sm z-50">
        <div class="p-6">
            <h1 class="text-xl font-bold text-blue-700 font-display-md">EduAdmin</h1>
            <p class="text-xs text-gray-500 mt-1">Portal Mentor</p>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 transition-all font-medium" href="#">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-700 border-r-4 border-blue-700 bg-blue-50/50 font-bold" href="#">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span> Pengguna
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 transition-all font-medium" href="#">
                <span class="material-symbols-outlined">school</span> Kelas
            </a>
        </nav>
    </aside>

    <!-- TopNavBar -->
    <header class="fixed top-0 right-0 left-64 h-16 flex justify-between items-center px-6 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="flex items-center flex-1 max-w-md">
            <div class="relative w-full">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                <input class="w-full pl-10 pr-4 py-2 bg-slate-50 border-none rounded-lg focus:ring-2 focus:ring-blue-700/20 text-sm" placeholder="Cari nama atau email..." type="text"/>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="ml-64 pt-16 min-h-screen p-8">
        <div class="max-w-7xl mx-auto">
            <div class="mb-10">
                <h2 class="text-3xl font-bold text-blue-900 mb-2">Manajemen Pengguna</h2>
                <p class="text-slate-500">Kelola data siswa dan tinjau kritik serta saran dari komunitas.</p>
            </div>

            <section class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mb-8">
                <div class="p-6 border-b border-slate-50 flex items-center justify-between">
                    <h4 class="text-lg font-bold">Daftar Pengguna</h4>
                    <button class="bg-blue-700 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg shadow-blue-700/20">Tambah Pengguna</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Nama</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Email</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Peran</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr>
                                <td class="px-6 py-4 font-bold">Andi Saputra</td>
                                <td class="px-6 py-4 text-slate-500">andi.saputra@gmail.com</td>
                                <td class="px-6 py-4"><span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">Siswa</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
