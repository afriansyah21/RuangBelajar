<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Daftar - Ruangbelajar</title>
    
    <!-- Tailwind and Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Separated Assets -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body class="bg-background font-body-md text-on-background">
    <main class="min-h-screen flex flex-col md:flex-row">
        <!-- Branding Side -->
        <section class="hidden lg:flex lg:w-1/2 bg-primary relative overflow-hidden flex-col justify-between p-xl text-white">
            <div class="relative z-10">
                <a class="text-3xl font-bold font-display-md flex items-center gap-2" href="#">
                    <span class="material-symbols-outlined text-4xl">school</span> Ruangbelajar
                </a>
                <div class="mt-16 max-w-md">
                    <h1 class="text-5xl font-bold leading-tight font-display-lg">Mulai Perjalanan Belajarmu Hari Ini.</h1>
                    <p class="mt-6 text-blue-100 text-lg">Platform edukasi terpercaya untuk membantu kamu meraih prestasi akademik terbaik.</p>
                </div>
            </div>
            <div class="relative z-10">
                <div class="p-6 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl max-w-sm">
                    <p className="text-sm italic">"Belajar jadi lebih terarah dan menyenangkan."</p>
                    <p className="text-xs font-bold mt-2">— Budi Santoso</p>
                </div>
            </div>
        </section>

        <!-- Form Side -->
        <section class="flex-1 flex items-center justify-center p-8 bg-white">
            <div class="w-full max-w-md">
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-slate-900">Buat Akun Baru</h2>
                    <p class="text-slate-500 mt-2">Lengkapi data diri Anda untuk memulai.</p>
                </div>
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Nama Lengkap</label>
                        <input class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-700/20" type="text" placeholder="Andi Wijaya"/>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">E-mail</label>
                        <input class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-700/20" type="email" placeholder="nama@email.com"/>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                        <input class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-700/20" type="password" placeholder="••••••••"/>
                    </div>
                    <button class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-700/20 hover:bg-blue-800 transition-all" type="submit">Sign Up</button>
                </form>
                <p class="mt-8 text-center text-sm text-slate-500">
                    Sudah punya akun? <a class="text-blue-700 font-bold hover:underline" href="#">Masuk di sini</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
