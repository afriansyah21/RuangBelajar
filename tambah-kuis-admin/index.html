<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tambah Kuis - Admin Portal</title>

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- ICON -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=4">

</head>

<body>

  <!-- BACKGROUND -->
  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="container navbar-content">

      <div class="logo">
        Admin RuangBelajar
      </div>

      <!-- Hamburger Button -->
      <button class="hamburger-btn" id="hamburger-btn">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="nav-menu" id="nav-menu">

        <a href="../admin-dashboard/index.html" class="nav-link">
          Dashboard
        </a>

        <a href="../manajemen-pengguna-admin/index.html" class="nav-link">
          Pengguna
        </a>

        <a href="../manajemen-kelas-admin/index.html" class="nav-link">
          Kelas
        </a>

        <a href="../manajemen-kuis-admin/index.html" class="nav-link active">
          Kuis
        </a>

        <a href="../manajemen-donasi-admin/index.html" class="nav-link">
          Donasi
        </a>

        <a href="../admin-login/index.html" class="nav-link nav-link-logout">

          <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 4px;">logout</span> Logout

        </a>

      </div>

      <div class="nav-actions">
          <a href="../admin-login/index.html" style="text-decoration:none; color:inherit;"><span class="material-symbols-outlined logout-icon-desktop" data-icon="logout">logout</span></a>
      </div>

    </div>

  </nav>

  <!-- MAIN CANVAS -->
  <main class="container">
    
    <!-- Top Header -->
    <header class="dashboard-header">
        <div class="dashboard-title">
            <button class="btn-back" onclick="window.location.href='../manajemen-kuis-admin/index.html'">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </button>
            <h1>Tambah Kuis Baru</h1>
            <p>Masukkan detail kuis yang ingin ditambahkan.</p>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="dashboard-content">
        
        <div class="form-card">
            <form id="form-tambah-kuis">
                
                <div class="form-group">
                    <label>Pilih Kelas</label>
                    <select id="course-id" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--outline); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; font-size: 1rem;">
                        <option value="" disabled selected>Memuat daftar kelas...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload Gambar Thumbnail</label>
                    <div class="upload-area" id="upload-area" onclick="document.getElementById('gambar-kuis').click()">
                        <span class="material-symbols-outlined upload-icon">cloud_upload</span>
                        <p id="file-name-display">Klik atau seret gambar ke sini</p>
                        <input type="file" id="gambar-kuis" accept="image/*" hidden onchange="handleImageSelect(this)" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Nama Kuis</label>
                    <input type="text" id="quiz-title" placeholder="Contoh: Front End Development" required />
                </div>

                <div class="form-group">
                    <label>Deskripsi Kuis</label>
                    <textarea rows="5" id="quiz-description" placeholder="Tuliskan deskripsi singkat tentang kuis ini..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-outline" onclick="window.location.href='../manajemen-kuis-admin/index.html'">Batal</button>
                    <button type="submit" class="btn-primary">Simpan Kuis</button>
                </div>
            </form>
        </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      <div>
        <h3>RuangBelajar Admin</h3>
        <p>© 2026 RuangBelajar platform pembelajaran</p>
      </div>
      <div class="footer-links">
        <a href="https://wa.me/6289528236913" target="_blank">Kontak Kami</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>

</body>

</html>
